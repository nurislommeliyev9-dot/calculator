<!DOCTYPE html>
<html lang="uz">
<head>

<title>Import bojxona boji kalkulyatori</title>
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#1c2824;--mute:#5d6b66;--line:#d5dcd7;--acc:#0e5a4a;--acc2:#e4f0ec;--warn:#8a5a00;--warnbg:#fbf1da;--bad:#a1281f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
header{background:var(--acc);color:#fff;padding:22px 20px 18px}
header h1{margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.01em}
header p{margin:0;opacity:.85;font-size:13.5px;max-width:900px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:16px;max-width:1280px;margin:16px auto;padding:0 16px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:0 0 4px}
input,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible,.item:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--acc);color:#fff}
.hint{font-size:12.5px;color:var(--mute);margin:6px 0 8px}
#list{max-height:68vh;overflow:auto;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:118px 1fr auto;gap:10px;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.item:hover,.item.sel{background:var(--acc2)}
.code{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.nm{font-size:13.5px}
.rt{font-weight:700;color:var(--acc);white-space:nowrap;text-align:right;font-size:13.5px}
.rt small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tag{display:inline-block;background:var(--acc);color:#fff;border-radius:4px;padding:0 6px;font-size:11.5px;margin-left:6px}
.sel-box{background:var(--acc2);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.sel-box b{font-variant-numeric:tabular-nums}
.sel-box div{font-size:13.5px;margin-top:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.note{background:var(--warnbg);color:var(--warn);border-radius:7px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;color:var(--ink);margin-bottom:10px}
.chk input{width:auto;margin-top:4px}
.res{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:12px 0}
.res div{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.res div:last-child{border:0}
.res .tot{background:var(--acc);color:#fff;font-size:18px;font-weight:700}
.res .dim{color:var(--mute)}
.res .win{font-weight:700}
.err{color:var(--bad);font-size:13px;margin:4px 0 8px}
.btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:none;color:var(--bad);cursor:pointer;font-size:16px}
.empty{color:var(--mute);padding:18px 6px;font-size:14px}
footer{max-width:1280px;margin:0 auto 24px;padding:0 16px;color:var(--ink);font-size:15px;font-weight:600}footer a{color:var(--acc);margin-left:8px;text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>

D.forEach((r,i)=>{r.S=norm(r[1]);r[0].forEach(c=>flat.push([c,i]))});
$('cnt').textContent=D.length;
const nm=r=>latin?tr(r[1]):r[1];
function rateTxt(r){const[,,p,k,a,u,per]=r;
 if(k===1)return{m:p+'%',s:`kamida ${fmt(a,a<1?2:0).replace(',00','')} USD / ${per>1?per+' ':''}${UN[u]}`};
 if(k===2)return{m:p+'%',s:`+ ${a} USD / sm³`};
 return{m:p+'%',s:''}}
function search(q){
 q=q.trim();if(!q)return[];
 if(/^[\d\s.]+$/.test(q)){
  const d=q.replace(/\D/g,'');if(d.length<2)return[];
  const best=new Map();
  for(const[c,i]of flat){let s=null;
   if(d.startsWith(c))s=[0,-c.length];else if(c.startsWith(d))s=[1,c.length];
   if(s){const o=best.get(i);if(!o||s[0]<o.s[0]||(s[0]===o.s[0]&&s[1]<o.s[1]))best.set(i,{i,code:c,s,ap:s[0]===0})}}
  const a=[...best.values()].sort((x,y)=>x.s[0]-y.s[0]||x.s[1]-y.s[1]||x.code.localeCompare(y.code));
  if(a.length&&a[0].ap)a[0].top=true;
  return a;
 }
 const w=norm(q).split(/\s+/).filter(Boolean);
 return D.map((r,i)=>({i,code:r[0][0]})).filter(o=>w.every(x=>D[o.i].S.includes(x)));
}
function renderList(){
 const res=search($('q').value),L=$('list');last=res;
 if(!$('q').value.trim()){L.innerHTML='<div class="empty">Kod yoki nom kiriting.</div>';return}
 if(!res.length){L.innerHTML='<div class="empty">Hech narsa topilmadi. </div>';return}
 const lim=80;
 L.innerHTML=res.slice(0,lim).map((o,n)=>{const r=D[o.i],t=rateTxt(r);
  const multi=r[0].length>1?` <span class="hint">(+${r[0].length-1})</span>`:'';
  return`<div class="item${sel&&sel.i===o.i&&sel.code===o.code?' sel':''}" tabindex="0" data-n="${n}"><div class="code">${fc(o.code)}${o.top?'<span class="tag">mos</span>':''}${multi}</div><div class="nm">${esc(nm(r))}</div><div class="rt">${t.m}${t.s?`<small>${esc(t.s)}</small>`:''}</div></div>`}).join('')
  +(res.length>lim?`<div class="empty">Yana ${res.length-lim} ta natija bor. Qidiruvni aniqlashtiring.</div>`:'');
 if(res[0].top&&res[0].code.length>=10&&$('q').value.replace(/\D/g,'').length>=10&&(!sel||sel.i!==res[0].i||sel.code!==res[0].code)){pick(res[0])}
}
function pick(o){sel={i:o.i,code:o.code};drawCalc();document.querySelectorAll('.item').forEach(e=>e.classList.toggle('sel',last[+e.dataset.n]===o))}
function activeFn(r,code){const n=r[7];if(!n)return null;const f=FN[n];if(!f)return null;
 const ok=!f.c||f.c.some(c=>code.startsWith(c));const live=new Date()<=new Date(f.u+'T23:59:59');
 return{n,f,ok,live}}
function drawCalc(){
 const r=D[sel.i],t=rateTxt(r),fn=activeFn(r,sel.code);
 let h=`<div class="sel-box"><b>${fc(sel.code)}</b><div>${esc(nm(r))}</div><div>Stavka: <b>${t.m}</b>${t.s?', '+esc(t.s):''}</div></div>`;
 if(fn){h+=`<div class="note">${esc(fn.f.t)} ${fn.ok?(fn.live?'':'Bu muddat o\'tib ketgan, jadvaldagi asosiy stavka qo\'llanadi.'):'Bu imtiyoz sizning kodingizga tegishli emas.'}</div>`;
  if(fn.ok&&fn.live)h+=`<label class="chk"><input type="checkbox" id="ex"> Imtiyozli stavkani (${fn.f.p}%) qo'llash</label>`}
 h+=`<div class="row"><div><label for="val">Bojxona qiymati</label><input id="val" inputmode="decimal" placeholder="0"></div>
 <div><label for="cur">Valyuta</label><select id="cur"><option>USD</option><option>UZS</option></select></div></div>
 <div class="row"><div><label for="rate">Markaziy bank kursi (so'm / 1 USD)</label><input id="rate" readonly value="${rateVal?fmt(rateVal):''}" placeholder="yuklanmoqda…"><div class="hint" id="rinfo">${esc(rinfo)}</div></div>`;
 if(r[3]===1)h+=`<div><label for="qty">${UQ[r[5]]}</label><input id="qty" inputmode="decimal" placeholder="0"></div>`;
 else if(r[3]===2)h+=`<div><label for="qty">Dvigatel hajmi (sm³)</label><input id="qty" inputmode="decimal" placeholder="masalan, 1500"></div>`;
 h+=`</div><div id="out"></div><div class="bar"><button class="btn" id="add">Ro'yxatga qo'shish</button></div>`;
 $('calc').innerHTML=h;
 $('calc').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));
 $('add').onclick=()=>{const c=calc();if(!c)return;basket.push({code:sel.code,name:nm(D[sel.i]),...c});drawBasket()};
 calc();
}
function calc(){
 const r=D[sel.i],o=$('out');
 const fn=activeFn(r,sel.code),ex=$('ex')&&$('ex').checked;
 let v=num($('val').value),rate=rateVal;
 const uzs=$('cur').value==='UZS';
 if(!(v>=0)){o.innerHTML='<div class="hint"></div>';return null}
 if(uzs&&!(rate>0)){o.innerHTML='<div class="err">Markaziy bank kursi hali yuklanmadi. Bir necha soniya kuting yoki sahifani yangilang.</div>';return null}
 const usd=uzs?v/rate:v;
 let pct=r[2],kind=r[3];if(ex){pct=fn.f.p;kind=0}
 const adv=usd*pct/100;let duty=adv,lines=[`<div><span>Bojxona qiymati</span><span>${fmt(usd)} USD</span></div>`,
  `<div class="${kind===1&&adv>=0?'':''}"><span>Advalor boj (${pct}%)</span><span>${fmt(adv)} USD</span></div>`];
 if(kind>0){const q=num(($('qty')||{}).value);
  if(!(q>0)){o.innerHTML=lines.join('').replace(/^/,'<div class="res">')+'</div><div class="err">Miqdorni kiriting: '+(kind===1?UQ[r[5]]:'dvigatel hajmi (sm³)')+'.</div>';return null}
  if(kind===1){const mn=r[4]*q/r[6];duty=Math.max(adv,mn);
   lines.push(`<div><span>Minimal boj (${r[4]} USD × ${fmt(q,q%1?2:0)} ${UN[r[5]]}${r[6]>1?' / '+r[6]:''})</span><span>${fmt(mn)} USD</span></div>`,
   `<div class="win"><span>Qo'llanadigan (kattasi)</span><span>${adv>=mn?'advalor':'minimal'}</span></div>`)}
  else{const sp=r[4]*q;duty=adv+sp;lines.push(`<div><span>Hajm bo'yicha (${r[4]} USD × ${fmt(q,q%1?2:0)} sm³)</span><span>${fmt(sp)} USD</span></div>`)}}
 lines.push(`<div class="tot"><span>Bojxona boji</span><span>${fmt(duty)} USD</span></div>`);
 if(rate>0)lines.push(`<div><span>so'mda (kurs ${fmt(rate,0)})</span><span>${fmt(duty*rate,0)} so'm</span></div>`);
 if(usd>0)lines.push(`<div class="dim"><span>Qiymatga nisbatan</span><span>${fmt(duty/usd*100)}%</span></div>`);
 lines.push(`<div class="dim"><span>Boj bilan jami</span><span>${fmt(usd+duty)} USD</span></div>`);
 o.innerHTML='<div class="res">'+lines.join('')+'</div>';
 return{usd,duty,rate:rate>0?rate:0}
}
function drawBasket(){
 const B=$('basket');
 if(!basket.length){B.innerHTML='<div class="empty">Ro\'yxat bo\'sh. Hisoblagandan so\'ng "Ro\'yxatga qo\'shish" tugmasini bosing.</div>';return}
 const tu=basket.reduce((s,x)=>s+x.usd,0),td=basket.reduce((s,x)=>s+x.duty,0),rt=basket.find(x=>x.rate)?.rate||0;
 B.innerHTML=`<div style="overflow-x:auto"><table><tr><th>Kod</th><th>Tovar</th><th class="n">Qiymat, USD</th><th class="n">Boj, USD</th><th></th></tr>`+
 basket.map((x,i)=>`<tr><td>${fc(x.code)}</td><td>${esc(x.name.length>60?x.name.slice(0,60)+'…':x.name)}</td><td class="n">${fmt(x.usd)}</td><td class="n">${fmt(x.duty)}</td><td><button class="x" data-d="${i}" aria-label="O'chirish">×</button></td></tr>`).join('')+
 `<tr><th colspan="2">Jami</th><th class="n">${fmt(tu)}</th><th class="n">${fmt(td)}</th><th></th></tr></table></div>`+
 (rt?`<div class="hint">Jami boj: ${fmt(td*rt,0)} so'm (kurs ${fmt(rt,0)})</div>`:'')+
 `<div class="bar" style="margin-top:8px"><button class="btn alt" id="xls">Excelga yuklab olish</button><button class="btn alt" id="clr">Tozalash</button></div>`;
 B.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{basket.splice(+b.dataset.d,1);drawBasket()});
 $('clr').onclick=()=>{basket=[];drawBasket()};
 $('xls').onclick=()=>{
  const hd=['№','IFT TN kodi','Tovar','Qiymat (USD)','Boj (USD)'].concat(rt?["Boj (so'm)"]:[]);
  const rows=basket.map((x,i)=>[i+1,fc(x.code),x.name,+x.usd.toFixed(2),+x.duty.toFixed(2)].concat(rt?[Math.round(x.duty*rt)]:[]));
  rows.push(['','','Jami',+tu.toFixed(2),+td.toFixed(2)].concat(rt?[Math.round(td*rt)]:[]));
  if(rt)rows.push(['','',"Kurs (so'm / USD)",rt]);
  if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([hd,...rows]);ws['!cols']=[{wch:4},{wch:16},{wch:60},{wch:14},{wch:12},{wch:16}];
   const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Hisob-kitob');XLSX.writeFile(wb,'bojxona-hisob.xlsx');return}
  const tb='<html><head><meta charset="utf-8"></head><body><table border="1"><tr>'+hd.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></body></html>';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+tb],{type:'application/vnd.ms-excel'}));a.download='bojxona-hisob.xls';a.click()};
}
$('q').addEventListener('input',renderList);
$('list').addEventListener('click',e=>{const it=e.target.closest('.item');if(it)pick(last[+it.dataset.n])});
$('list').addEventListener('keydown',e=>{if(e.key==='Enter'){const it=e.target.closest('.item');if(it)pick(last[+it.dataset.n])}});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&last&&last.length)pick(last[0])});
$('bL').onclick=()=>{latin=true;$('bL').classList.add('on');$('bC').classList.remove('on');renderList();if(sel)drawCalc()};
$('bC').onclick=()=>{latin=false;$('bC').classList.add('on');$('bL').classList.remove('on');renderList();if(sel)drawCalc()};
function setRate(r,d,src){rateVal=r;rinfo=`Markaziy bank kursi: 1 USD = ${fmt(r)} so'm (${d})`+(src||'');const e=$('rate');if(e)e.value=fmt(r);const i=$('rinfo');if(i)i.textContent=rinfo;if(sel)calc();if(basket.length)drawBasket()}
async function loadCBU(){
 const today=new Date().toISOString().slice(0,10);
 try{const c=JSON.parse(localStorage.getItem('cbuUSD')||'null');if(c&&c.k===today){setRate(c.r,c.d);return}}catch(e){}
 const u='https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/';
 const urls=[u,u.replace('/uz/','/oz/'),u.replace('/uz/','/ru/'),'https://api.allorigins.win/raw?url='+encodeURIComponent(u),'https://corsproxy.io/?'+encodeURIComponent(u)];
 for(const url of urls){
  try{const res=await fetch(url);const j=await res.json();
   const r=parseFloat(String(j[0].Rate).replace(',','.')),d=j[0].Date;if(!(r>0))continue;
   setRate(r,d);try{localStorage.setItem('cbuUSD',JSON.stringify({k:today,r,d}))}catch(e){}return}catch(e){}
 }
 let old=null;try{old=JSON.parse(localStorage.getItem('cbuUSD')||'null')}catch(x){}
 if(old)setRate(old.r,old.d,' (yangilab bo\'lmadi, oxirgi saqlangan kurs)');
 else{rinfo='Markaziy bank kursini olib bo\'lmadi. Internetni tekshiring, 30 soniyadan so\'ng qayta uriniladi.';const i=$('rinfo');if(i)i.textContent=rinfo;setTimeout(loadCBU,30000)}
}
loadCBU();setInterval(()=>{try{const c=JSON.parse(localStorage.getItem('cbuUSD')||'null');if(!c||c.k!==new Date().toISOString().slice(0,10))loadCBU()}catch(e){}},3600000);
renderList();
</script>
